name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation. Do not
        include credentials, personal data, or private operational details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, compatibility, or deployment impact
      description: Note API changes, migrations, new services, or data-handling changes.
    validations:
      required: false
