name: android

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: https://it.rainstone.top
      - run: npx cap sync android
        working-directory: web
      - run: ./gradlew assembleDebug
        working-directory: web/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: https://it.rainstone.top
      - run: npx cap sync android
        working-directory: web
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: ./gradlew bundleRelease assembleRelease
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Collect release artifacts
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/bundle/release/app-release.aab release/app-release.aab
          cp web/android/app/build/outputs/apk/release/app-release.apk release/app-release.apk
          sha256sum release/app-release.apk release/app-release.aab > release/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/app-release.apk
            release/app-release.aab
            release/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/
