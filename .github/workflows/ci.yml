name: ci

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      playwright_grep:
        description: Optional Playwright test name filter
        required: false
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: interview
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://interview:interview@127.0.0.1:55432/interview
      REDIS_URL: redis://127.0.0.1:56379/0
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests evals migrations
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run python -m evals.run

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: technical-interview-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image runtime contract
        run: |
          test "$(docker image inspect technical-interview-agent:ci --format '{{.Config.User}}')" = "app"
          docker run --rm technical-interview-agent:ci technical-interview-agent --help
          docker run --rm technical-interview-agent:ci technical-interview-agent worker --reload 2>&1 | grep -- "--reload is only supported"
          docker run --rm technical-interview-agent:ci python -c "import app.main, app.worker"

  webkit-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: interview
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://interview:interview@127.0.0.1:55432/interview
      REDIS_URL: redis://127.0.0.1:56379/0
      E2E_BROWSER: webkit
      MAIL_LOCAL_RESET_FILE: /tmp/technical-interview-agent-password-reset.json
      RESUME_STORAGE_DIR: /tmp/technical-interview-agent-resume-files
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8100
      - run: npx playwright install --with-deps webkit
        working-directory: web
      - name: Run WebKit E2E
        working-directory: web
        run: npm run test:e2e -- ${PLAYWRIGHT_GREP:+--grep "$PLAYWRIGHT_GREP"}
        env:
          CI: "true"
          DATABASE_URL: postgresql+asyncpg://interview:interview@127.0.0.1:55432/interview
          REDIS_URL: redis://127.0.0.1:56379/0
          E2E_BROWSER: webkit
          MAIL_LOCAL_RESET_FILE: /tmp/technical-interview-agent-password-reset.json
          PLAYWRIGHT_WEB_COMMAND: npm run preview -- --port 3101
          PLAYWRIGHT_GLOBAL_TIMEOUT_MS: "900000"
          PLAYWRIGHT_GREP: ${{ inputs.playwright_grep }}
          RESUME_STORAGE_DIR: /tmp/technical-interview-agent-resume-files
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

