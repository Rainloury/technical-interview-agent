name: technical-interview-agent

x-application: &application
  image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}:${IMAGE_TAG:?set IMAGE_TAG}
  env_file:
    - ${PRODUCTION_ENV_FILE:?set PRODUCTION_ENV_FILE}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    <<: *application
    command: ["technical-interview-agent", "migrate"]
    restart: "no"

  api:
    <<: *application
    command: ["technical-interview-agent", "api"]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  worker:
    <<: *application
    command: ["technical-interview-agent", "worker"]
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, pathlib, sys, time; p=pathlib.Path('/var/run/technical-interview-agent/worker-health.json'); d=json.loads(p.read_text()); sys.exit(0 if d.get('state') == 'running' and time.time() - pathlib.Path(p).stat().st_mtime < 30 else 1)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
