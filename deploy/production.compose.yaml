name: technical-interview-agent-production

x-application: &application
  image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}:${IMAGE_TAG:?set IMAGE_TAG}
  env_file:
    - ${PRODUCTION_ENV_FILE:?set PRODUCTION_ENV_FILE}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /var/run/technical-interview-agent:size=1m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  web:
    image: ${WEB_IMAGE_REPOSITORY:?set WEB_IMAGE_REPOSITORY}:${IMAGE_TAG:?set IMAGE_TAG}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    <<: *application
    command: ["technical-interview-agent", "migrate"]
    restart: "no"

  api:
    <<: *application
    command: ["technical-interview-agent", "api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  worker:
    <<: *application
    command: ["technical-interview-agent", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - worker-health:/var/run/technical-interview-agent
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, pathlib, sys, time; p=pathlib.Path('/var/run/technical-interview-agent/worker-health.json'); d=json.loads(p.read_text()); sys.exit(0 if d.get('state') == 'running' and time.time() - pathlib.Path(p).stat().st_mtime < 30 else 1)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  alerts:
    <<: *application
    command: ["technical-interview-agent", "alerts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    network_mode: "service:api"
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - worker-health:/var/run/technical-interview-agent:ro
    healthcheck:
      disable: true

volumes:
  postgres-data:
  worker-health:
