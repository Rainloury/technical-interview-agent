name: technical-interview-agent-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  storage-init:
    image: technical-interview-agent-api:local
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/technical-interview-agent/resumes /var/lib/technical-interview-agent/tool-results /var/run/technical-interview-agent && chown -R 10001:10001 /var/lib/technical-interview-agent /var/run/technical-interview-agent",
      ]
    volumes:
      - app-data:/var/lib/technical-interview-agent
      - worker-health:/var/run/technical-interview-agent
    restart: "no"

  migrate:
    image: technical-interview-agent-api:local
    command: ["technical-interview-agent", "migrate"]
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      RESUME_STORAGE_BACKEND: local
      RESUME_STORAGE_DIR: /var/lib/technical-interview-agent/resumes
      TOOL_RESULT_DIR: /var/lib/technical-interview-agent/tool-results
      MAIL_LOCAL_RESET_FILE: /var/lib/technical-interview-agent/password-reset.json
      WORKER_HEALTH_FILE: /var/run/technical-interview-agent/worker-health.json
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/technical-interview-agent

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: technical-interview-agent-api:local
    command: ["technical-interview-agent", "api"]
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_ALLOWED_ORIGINS: '["http://127.0.0.1:8080"]'
      CSRF_ALLOWED_ORIGINS: '["http://127.0.0.1:8080"]'
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      RESUME_STORAGE_BACKEND: local
      RESUME_STORAGE_DIR: /var/lib/technical-interview-agent/resumes
      TOOL_RESULT_DIR: /var/lib/technical-interview-agent/tool-results
      MAIL_LOCAL_RESET_FILE: /var/lib/technical-interview-agent/password-reset.json
      WORKER_HEALTH_FILE: /var/run/technical-interview-agent/worker-health.json
      PASSWORD_RESET_BASE_URL: http://127.0.0.1:8080/reset-password
    expose:
      - "8000"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
    volumes:
      - app-data:/var/lib/technical-interview-agent
      - worker-health:/var/run/technical-interview-agent

  worker:
    image: technical-interview-agent-api:local
    command: ["technical-interview-agent", "worker"]
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      RESUME_STORAGE_BACKEND: local
      RESUME_STORAGE_DIR: /var/lib/technical-interview-agent/resumes
      TOOL_RESULT_DIR: /var/lib/technical-interview-agent/tool-results
      MAIL_LOCAL_RESET_FILE: /var/lib/technical-interview-agent/password-reset.json
      WORKER_HEALTH_FILE: /var/run/technical-interview-agent/worker-health.json
      PASSWORD_RESET_BASE_URL: http://127.0.0.1:8080/reset-password
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, pathlib, sys, time; p=pathlib.Path('/var/run/technical-interview-agent/worker-health.json'); d=json.loads(p.read_text()); sys.exit(0 if d.get('state') == 'running' and time.time() - p.stat().st_mtime < 90 else 1)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
    volumes:
      - app-data:/var/lib/technical-interview-agent
      - worker-health:/var/run/technical-interview-agent

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: technical-interview-agent-web:local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12

volumes:
  postgres-data:
  app-data:
  worker-health:
