[project]
name = "technical-interview-agent"
version = "0.1.0"
description = "A bounded technical interview agent service."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "fastapi==0.143.3",
  "pydantic-settings==2.16.0",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.5.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pre-commit==4.7.0",
  "pyyaml==6.0.3",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.17.1",
  "types-pyyaml==6.0.12.20250915",
]

[project.scripts]
technical-interview-agent = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
markers = [
  "integration: requires PostgreSQL and Redis",
  "eval: behavioral evaluation case",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
  "RUF",
  "S",
  "SIM",
]
ignore = [
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
"evals/**/*.py" = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg.*", "redis.*", "structlog.*"]
ignore_missing_imports = true

